<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>邮箱验证 · StagePeek</title><link rel="stylesheet" href="/style.css"><script type="module" src="/auth-page.mjs"></script></head>
<body class="theme-arena"><main class="dialog-content" style="max-width:440px;margin:10vh auto;padding:28px"><a href="/" aria-label="返回 StagePeek 首页"><img src="/brand/stagepeek-logo-dark.svg" width="190" height="54" alt="StagePeek"></a><h1 id="auth-title">邮箱验证码登录</h1><p id="auth-description">输入邮箱获取验证码，再回到本页验证。首次验证后创建 StagePeek 账号。</p><form id="auth-form"><label>邮箱地址<input id="auth-email" type="email" autocomplete="email" maxlength="254" required></label><button id="auth-send" class="primary wide">发送验证码</button><div id="auth-code-field" hidden><label>邮箱验证码<input id="auth-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10"></label><button id="auth-verify" type="button" class="primary wide">验证并登录</button><button id="auth-change" type="button" class="wide">换一个邮箱</button></div></form><p id="auth-feedback" role="status" aria-live="polite"></p><a href="/">返回场馆预览</a></main></body></html>
