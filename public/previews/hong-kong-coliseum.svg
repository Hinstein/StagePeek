<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">红馆 · 两种舞台布局阅读示意</title><desc id="desc">StagePeek 原创布局阅读示意。非实景，非按比例座位表，不表示实际分区几何或视线。</desc><rect width="960" height="540" rx="16" fill="#111c22"/><g font-family="system-ui, sans-serif"><text x="40" y="53" fill="#c9ff51" font-size="14" letter-spacing="3">STAGEPEEK / LAYOUT READING</text><text x="40" y="95" fill="#edf4ec" font-size="28" font-weight="700">红馆 · 两种舞台布局阅读示意</text><text x="40" y="130" fill="#b4c5be" font-size="18">先确认四面台或正面舞台，再比较方向</text><rect x="120" y="192" width="280" height="214" rx="70" fill="none" stroke="#a58bd7" stroke-width="14"/><rect x="142" y="214" width="236" height="170" rx="56" fill="none" stroke="#719ba5" stroke-width="14"/><rect x="164" y="236" width="192" height="126" rx="42" fill="none" stroke="#95b780" stroke-width="14"/><rect x="232" y="278" width="56" height="40" rx="5" fill="#c9ff51"/><text x="260" y="304" text-anchor="middle" fill="#10200f" font-size="14">舞台</text><rect x="560" y="192" width="280" height="214" rx="70" fill="none" stroke="#a58bd7" stroke-width="14"/><rect x="582" y="214" width="236" height="170" rx="56" fill="none" stroke="#719ba5" stroke-width="14"/><rect x="604" y="236" width="192" height="126" rx="42" fill="none" stroke="#95b780" stroke-width="14"/><rect x="660" y="233" width="80" height="24" rx="4" fill="#c9ff51"/><text x="700" y="300" text-anchor="middle" fill="#b4c5be" font-size="16">内场按场次变化</text><text x="260" y="450" text-anchor="middle" fill="#edf4ec" font-size="20">四面台 center</text><text x="700" y="450" text-anchor="middle" fill="#edf4ec" font-size="20">正面舞台 end</text><path d="M40 478H920" stroke="#304048"/><text x="40" y="512" fill="#aebfb5" font-size="16">舞台仅为位置关系示意 · 原创示意 · 非按比例 · 非实景</text></g></svg>