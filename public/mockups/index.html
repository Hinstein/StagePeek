<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeatPeep · 前端风格样稿</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f1;color:#162c25}button,select{font:inherit}button{cursor:pointer;border:0} .shell{min-height:100vh;padding:28px 32px 100px}.top{display:flex;align-items:center;justify-content:space-between;max-width:1440px;margin:auto}.logo{font-weight:900;font-size:24px;letter-spacing:-1px}.logo i{color:#e37a43;font-style:normal}.top nav{display:flex;gap:8px}.top nav button,.venue-select{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #dce5dc;color:inherit}.top nav button:last-child{background:#183a30;color:#fff}.hero{max-width:1440px;margin:58px auto 24px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:11px;letter-spacing:2px;opacity:.56}.hero h1{font-size:clamp(28px,4vw,54px);line-height:1.03;letter-spacing:-2px;margin:8px 0}.hero p{opacity:.65;margin:0}.hero .badge{padding:8px 12px;border-radius:20px;background:#e2eddc;color:#41623d;white-space:nowrap}.filters{max-width:1440px;margin:0 auto 20px;padding:16px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;background:#fff;border:1px solid #dce5dc;border-radius:16px}.filters label{display:grid;gap:5px;font-size:11px;font-weight:700;opacity:.7}.filters select,.filters input{height:42px;border:1px solid #dce5dc;border-radius:9px;padding:0 11px;background:#fbfdf9;color:inherit}.filters .go{align-self:end;height:42px;padding:0 18px;border-radius:9px;background:#183a30;color:#fff;font-weight:700}.content{max-width:1440px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.viewer-card,.panel{background:#fff;border:1px solid #dce5dc;border-radius:18px;overflow:hidden}.viewer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px}.viewer-head h2{font-size:18px;margin:0}.viewer-head p{font-size:12px;opacity:.6;margin:3px 0 0}.tabs{display:flex;gap:5px}.tabs button{padding:8px 11px;border-radius:9px;background:#f2f5ef;color:inherit}.tabs .active{background:#dfead9;color:#31543d}.stage{position:relative;height:590px;overflow:hidden;background:#dce5d8}.stage:before{content:"";position:absolute;inset:11% 8%;border-radius:50%;background:radial-gradient(ellipse at center,#a8bd8c 0 26%,#dbe4d6 27% 29%,transparent 30%),repeating-radial-gradient(ellipse at center,#35634c 0 3px,transparent 4px 20px);transform:perspective(800px) rotateX(54deg) scale(1.25);opacity:.95}.stage:after{content:"STAGE";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotateX(54deg);width:180px;height:74px;background:#273c32;display:grid;place-items:center;color:#e4eedc;letter-spacing:4px;border-radius:7px;box-shadow:0 18px 26px #20372b55}.stage-tools{position:absolute;z-index:2;left:16px;right:16px;top:16px;display:flex;justify-content:space-between}.stage-tools button{padding:8px 11px;border-radius:9px;background:#ffffffdc;color:#1d382d}.stage-tools .selected{background:#1d4034;color:#fff}.hint{position:absolute;z-index:2;bottom:14px;left:16px;padding:6px 10px;border-radius:8px;background:#ffffffc7;font-size:11px}.sidebar{display:grid;gap:14px}.panel{padding:20px}.panel .kicker{font-size:10px;letter-spacing:1.4px;opacity:.55}.panel h3{font-size:32px;margin:5px 0}.panel hr{border:0;border-top:1px solid #e3e9e1;margin:16px 0}.metric strong{font-size:25px;display:block}.metric small{opacity:.58}.panel .wide{width:100%;padding:11px;border-radius:9px;background:#183a30;color:#fff;margin-top:15px}.panel-list{display:grid;gap:9px;margin-top:14px}.panel-list div{display:flex;justify-content:space-between;padding:10px;border-radius:9px;background:#f3f6f1;font-size:12px}.style-switch{position:fixed;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:16px;background:#172b25eF;box-shadow:0 12px 40px #001b1233}.style-switch button{padding:9px 12px;border-radius:10px;background:transparent;color:#d7e6da;font-size:12px}.style-switch button.active{background:#e6f0df;color:#19372d}

    /* 1 · Editorial */
    body.editorial{background:radial-gradient(circle at 10% 0,#fff 0,#f4f6f1 40%,#edf2eb 100%)}

    /* 2 · Arena dark */
    body.arena{background:#090d12;color:#f5f6f2}.arena .top nav button,.arena .venue-select,.arena .viewer-card,.arena .panel,.arena .filters{background:#111820;border-color:#28343d;color:#edf3ee}.arena .hero .badge{background:#c9ff51;color:#19210e}.arena .filters select,.arena .filters input{background:#0c1218;border-color:#2c3942;color:#f5f6f2}.arena .filters .go{background:#c9ff51;color:#121b0c}.arena .stage{background:radial-gradient(circle at 50% 45%,#273241,#0c1219 70%)}.arena .stage:before{background:radial-gradient(ellipse at center,#6e43ff22 0 23%,#313c49 24% 25%,transparent 26%),repeating-radial-gradient(ellipse at center,#8b5cff 0 2px,transparent 3px 20px);filter:drop-shadow(0 0 12px #875cff)}.arena .stage:after{background:#c9ff51;color:#111b0b;box-shadow:0 0 35px #c9ff5199}.arena .stage-tools button,.arena .hint{background:#101820dd;color:#eef6ed;border:1px solid #3c4c55}.arena .stage-tools .selected{background:#c9ff51;color:#111b0b}.arena .panel-list div{background:#19232b}.arena .panel hr{border-color:#2b3840}.arena .style-switch{background:#eef4e9}.arena .style-switch button{color:#284236}.arena .style-switch button.active{background:#c9ff51;color:#15200c}.arena .logo i{color:#c9ff51}

    /* 3 · Glass */
    body.glass{background:linear-gradient(135deg,#10192a,#2a3552 55%,#7c6b85);color:#f8fafc}.glass .top nav button,.glass .venue-select,.glass .viewer-card,.glass .panel,.glass .filters{background:#ffffff17;border-color:#ffffff2e;color:#fff;backdrop-filter:blur(18px)}.glass .top nav button:last-child,.glass .filters .go{background:#fff;color:#28324c}.glass .hero p,.glass .viewer-head p,.glass .panel .kicker,.glass .metric small{opacity:.72}.glass .hero .badge{background:#ffffff24;color:#fff;border:1px solid #ffffff35}.glass .filters select,.glass .filters input{background:#ffffff13;border-color:#ffffff35;color:#fff}.glass .filters option{color:#17233c}.glass .stage{background:linear-gradient(145deg,#5e72a0,#232c49)}.glass .stage:before{background:radial-gradient(ellipse at center,#7ec6bd 0 25%,#ffffff20 26% 28%,transparent 29%),repeating-radial-gradient(ellipse at center,#b8f1df 0 2px,transparent 3px 20px);opacity:.72}.glass .stage:after{background:#f6d594;color:#40334a;box-shadow:0 18px 35px #10193488}.glass .stage-tools button,.glass .hint{background:#ffffff26;color:#fff;border:1px solid #ffffff40;backdrop-filter:blur(12px)}.glass .stage-tools .selected{background:#f6d594;color:#42334a}.glass .panel-list div{background:#ffffff18}.glass .panel hr{border-color:#ffffff27}.glass .style-switch{background:#ffffff1c;border:1px solid #ffffff38;backdrop-filter:blur(14px)}.glass .style-switch button.active{background:#f6d594;color:#43334a}

    /* 4 · Utility */
    body.utility{background:#f7f8fa;color:#17212b}.utility .top{max-width:none}.utility .logo{font-size:18px;letter-spacing:0}.utility .hero{max-width:none;margin:34px auto 16px}.utility .hero h1{font-size:34px;letter-spacing:-1px}.utility .filters,.utility .content{max-width:none}.utility .filters,.utility .viewer-card,.utility .panel{border-radius:6px;box-shadow:0 2px 8px #2030400c}.utility .viewer-head{padding:14px 16px}.utility .stage{height:540px;background:#eef1f4}.utility .stage:before{background:radial-gradient(ellipse at center,#cbd4dc 0 25%,#fff 26% 27%,transparent 28%),repeating-radial-gradient(ellipse at center,#495966 0 2px,transparent 3px 19px)}.utility .stage:after{background:#344657;border-radius:2px;width:160px;height:62px}.utility .stage-tools button,.utility .hint{border-radius:4px;background:#fff;border:1px solid #d4dbe0}.utility .stage-tools .selected{background:#344657;color:#fff}.utility .panel h3{font-size:28px}.utility .panel-list div{border-radius:4px;background:#f0f3f5}.utility .style-switch{background:#fff;border:1px solid #d8e0e5;box-shadow:0 8px 25px #2638471c}.utility .style-switch button{color:#50616e}.utility .style-switch button.active{background:#344657;color:#fff}
    @media(max-width:900px){.shell{padding:18px 14px 100px}.hero{margin-top:34px}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.filters .go{grid-column:1/-1}.content{grid-template-columns:1fr}.stage{height:58vh;min-height:420px}.sidebar{grid-template-columns:1fr 1fr}.sidebar .panel:first-child{grid-column:1/-1}.style-switch{max-width:calc(100% - 20px);overflow:auto;white-space:nowrap}}
    @media(max-width:520px){.top nav button:first-child{display:none}.hero{display:block}.hero .badge{display:inline-block;margin-top:18px}.filters{grid-template-columns:1fr}.filters label:first-child{grid-column:auto}.sidebar{grid-template-columns:1fr}.sidebar .panel:first-child{grid-column:auto}.viewer-head{align-items:flex-start;gap:10px;flex-direction:column}.tabs{width:100%}.tabs button{flex:1}.stage{min-height:390px}.style-switch button{padding:8px 9px;font-size:11px}}
  </style>
</head>
<body class="editorial">
  <div class="shell">
    <header class="top"><div class="logo">Seat<span>Scope</span></div><nav><button>已存位置</button><button>Pro · 管理订阅</button><button>我的账号</button></nav></header>
    <section class="hero"><div><div class="eyebrow">EXPLORE THE VENUE</div><h1>先找到座位，再期待现场。</h1><p>选择场馆，输入门票上的区、排和座号。</p></div><span class="badge">197 个场馆 · 19 个国家/地区</span></section>
    <form class="filters"><label>国家 / 地区<select><option>全部国家/地区</option><option>美国（4）</option><option>英国（4）</option><option>日本（15）</option></select></label><label>场馆<select><option>Tottenham Hotspur Stadium</option></select></label><label>Section / Block<input value="122"></label><label>Row / Seat<input value="14 / 679"></label><button class="go">定位我的座位 ↗</button></form>
    <main class="content"><section class="viewer-card"><header class="viewer-head"><div><h2>Tottenham Hotspur Stadium</h2><p>英国 · 伦敦 · Tottenham</p></div><div class="tabs"><button>2D 座位图</button><button class="active">3D 视角</button></div></header><div class="stage"><div class="stage-tools"><div><button class="selected">场馆总览</button><button>观众视角</button><button>靠近分区</button></div><div><button>1×</button><button>2×</button><button>5×</button></div></div><div class="hint">拖动旋转 · 双指缩放 · 点击分区</div></div></section><aside class="sidebar"><section class="panel"><div class="kicker">YOUR LOCATION</div><h3>122</h3><div class="metric"><strong>约 60 m</strong><small>至表演者 · 直线估算</small></div><hr><div>来源座位已匹配 · 未实测校准</div><button class="wide">＋ 保存这个位置</button></section><section class="panel"><div class="kicker">EVENT</div><h4>选择演唱会</h4><p>场次布局会影响舞台位置和可售座位。</p><div class="panel-list"><div><span>Travis Scott · 2026</span><b>参考</b></div><div><span>自由预览</span><b>通用</b></div></div></section></aside></main>
  </div>
  <div class="style-switch" aria-label="样式选择"><button data-style="editorial" class="active">01 明亮杂志</button><button data-style="arena">02 深色现场</button><button data-style="glass">03 玻璃卡片</button><button data-style="utility">04 极简工具</button></div>
  <script type="module" src="./mockups.mjs"></script>
</body>
</html>
