<script type="text/javascript">
    /* NSI : 7/13/12 4:27 PM --- User agent add site as home screen on ipad case check*/
    var ua = navigator.userAgent.toLowerCase();
    var bool = false;
    if ((ua.indexOf('ipad')!=-1) || (ua.indexOf('iphone')!=-1) || (ua.indexOf('mobile')!=-1)) {
        document.getElementById("Shell_Header").style.display = "none";
        document.getElementById("Shell_Footer").style.display = "none";
        document.title = "Los Angeles Rams";
        bool = true;
    }

    function updateOrientation()
    {
        viewport = document.querySelector("meta[name=viewport]");
        switch(window.orientation)
        {
            case 0:
                window.scrollTo(0,0)
                $('#alertMsg').css('z-index','2147483647');
                counter++
                viewport.setAttribute('content', 'initial-scale=1,maximum-scale=1,user-scalable=no');
                workAroundAdjust()
                $("#alertMsg img").css({"left":"55%"})
                break;
            case -90:
                window.scrollTo(0,0)
                counter++
                $("#appView").css("margin-left","0px")
                viewport.setAttribute('content', ' initial-scale=1, maximum-scale=1,user-scalable=no');
                $("#alertMsg").hide();
                $('#sectionSelectorBoxView').css({"bottom":(Constants.MAIN_VIEW_HEIGHT-window.innerHeight + 37)});
                setTimeout(function(){$("#appView").width(1024); $("#appView").height(window.innerHeight);},300);
                break;
            case 90:
                counter++
                window.scrollTo(0,0)
                $("#appView").css("margin-left","0px")
                viewport.setAttribute('content', 'initial-scale=1, maximum-scale=1,user-scalable=no');
                $("#alertMsg").hide();
                $('#sectionSelectorBoxView').css({"bottom":(Constants.MAIN_VIEW_HEIGHT-window.innerHeight + 37)})
                setTimeout(function(){$("#appView").width(1024); $("#appView").height(window.innerHeight);},300)
                break;
            case 180:
                $('#alertMsg').css('z-index','2147483647');
                counter++
                viewport.setAttribute('content', 'initial-scale=1, maximum-scale=1,user-scalable=no');
                workAroundAdjust()
                var userAgent = navigator.userAgent.toLowerCase();
                $.browser.chrome = /crios/.test(navigator.userAgent.toLowerCase());
                if($.browser.chrome){
                    $("#alertMsg img").css({"left":"55%"})
                }
                break;
        }

    }
    function workAroundAdjust(){
        if(Constants.BROWSER_TYPE == Constants.BROWSER_SAFARI_MOBILE){
            document.activeElement.blur();

        }
        $("#alertMsg").width(document.documentElement.clientWidth);
        $("#alertMsg").height(document.documentElement.clientHeight);
        $("#alertMsg").show();

        if(isClicked){
            $("#alertMsg").width(900)
            $("#alertMsg").height(1024)
            $("#alertMsg img").width(409.33333)
            $("#alertMsg img").height(204.6666)
            $("#alertMsg img").css({"left":"68%"})
        }
        if(counter !==0){

            $("#alertMsg").width(900)
            $("#alertMsg").height(1024)
            $("#alertMsg img").width(409.33333)
            $("#alertMsg img").height(204.6666)
            $("#alertMsg img").css({"left":"68%"})
        }

    }
    function checkView()
    {
        if ((ua.indexOf('ipad')!=-1) || (ua.indexOf('iphone')!=-1) || (ua.indexOf('mobile')!=-1)) {
            viewport = document.querySelector("meta[name=viewport]");
            isClicked = false

            $("#Search_Box").bind("click",function(){
                isClicked = true
            })
            counter =0;
            if(window.orientation == 0 || window.orientation == 180)
            {
                $('#alertMsg').css('z-index','2147483647');
                $("#alertMsg").width(document.documentElement.clientWidth+300)
                $("#alertMsg").height(document.documentElement.clientHeight+335)
                $("#alertMsg").show();
                $("#appView")[0].style.height=672+"px";
                $("#appView")[0].style.width=1024+"px";
                viewport.setAttribute('content', ' initial-scale=0.75, maximum-scale=0.75,user-scalable=no');
            }
            else
            {
                viewport.setAttribute('content', 'initial-scale=1, maximum-scale=1');
                $("#appView")[0].style.height=document.documentElement.clientHeight+"px";
                setTimeout(function(){$("#appView").width(1024)},300)

            }
        }
    }

</script>
