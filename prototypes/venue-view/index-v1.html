<aside class="inspector"><div class="label">YOUR LOCATION / 模拟入座</div><div class="ticket"><strong id="ticket-section"></strong><span id="ticket-row"></span></div><div class="stats"><div><b id="distance"></b><small>至表演者 · 直线估算</small></div><div><b id="edge-distance"></b><small>至最近舞台边 · 平面</small></div></div><div class="phone-title"><strong>从这里拍到的人</strong><b id="zoom-value">5×</b></div><canvas class="phone" id="phone" aria-label="手机取景预览，显示舞台上的人物"></canvas><div class="zoom-label"><span>24mm 等效基准 · 横屏 4:3</span><span id="frame-percent"></span></div><input id="zoom" aria-label="手机变焦倍率" type="range" min="1" max="10" step="0.1" value="5"><div class="zoom-buttons"><button data-zoom="1">1×</button><button data-zoom="2">2×</button><button data-zoom="5">5×</button><button data-zoom="10">10×</button></div><p class="note" id="confidence"></p><div class="state" id="model-state"></div></aside></div>
<div class="scenario" aria-label="试用场景"><button data-demo="near">试一试：前排 vs 后排</button><button data-demo="stage">试一试：舞台移到中央</button><button data-demo="zoom">试一试：1× vs 10×</button></div><div class="foot">验证原型：分区编号参考官方资料，轮廓、尺度、层高与排座为原创估算。人物 1.75m，舞台高 2.2m；不模拟画质、实际遮挡或现场灯光。当前未取得图纸／模型商用授权。</div>

let near=false;document.querySelector('[data-demo=near]').onclick=()=>{near=!near;state.row=near?1:30;$('row').value=state.row;update()};document.querySelector('[data-demo=stage]').onclick=()=>{state.layout=state.layout==='center'?'end':'center';$('layout').value=state.layout;update()};document.querySelector('[data-demo=zoom]').onclick=()=>{state.zoom=state.zoom===10?1:10;$('zoom').value=state.zoom;update()};
resizeObserver=new ResizeObserver(()=>{if(state.mode==='3d')drawWorld($('scene'),false);drawWorld($('phone'),true)});resizeObserver.observe($('view'));resizeObserver.observe($('phone'));variant();
</script></body></html>
